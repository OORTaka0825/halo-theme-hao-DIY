apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-menu
spec:
  targetRef:
    group: ''
    kind: MenuItem
  formSchema:
  - $formkit: text
    name: icon
    label: 图标
  - $formkit: radio
    name: isVertical
    value: '0'
    label: 该菜单的子菜单是否为垂直菜单
    options:
    - label: 是
      value: '1'
    - label: 否
      value: '0'

---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-link-group
spec:
  targetRef:
    group: core.halo.run
    kind: LinkGroup
  formSchema:
  - $formkit: radio
    name: displayStyle
    label: 分组方式
    value: default
    options:
    - label: 默认
      value: default
    - label: 美化
      value: beautify
    - label: 失联
      value: deprecated
  - $formkit: textarea
    name: description
    label: 描述

---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-link
spec:
  targetRef:
    group: core.halo.run
    kind: Link
  formSchema:
  - $formkit: attachment
    name: siteshot
    label: 背景
  - $formkit: text
    name: label
    label: 标签
  - $formkit: color
    name: labelColor
    value: '#425AEF'
    label: 标签颜色

---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-photo-group
spec:
  targetRef:
    group: core.halo.run
    kind: PhotoGroup
  formSchema:
  - $formkit: attachment
    name: cover
    label: 分组图片
  - $formkit: attachment
    name: background
    label: 分组顶部 banner 图片
  - $formkit: textarea
    name: description
    label: 分组描述

---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-equipment-group
spec:
  targetRef:
    group: core.halo.run
    kind: EquipmentGroup
  formSchema:
  - $formkit: textarea
    name: description
    label: 分组描述

---

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: annotation-setting-hao-equipment
spec:
  targetRef:
    group: core.halo.run
    kind: Equipment
  formSchema:
  - $formkit: text
    name: model
    label: 装备型号/版本
  - $formkit: text
    name: button
    label: 左下角按钮显示文字
    value: 详情
  - $formkit: text
    name: link
    label: 左下角按钮跳转链接

