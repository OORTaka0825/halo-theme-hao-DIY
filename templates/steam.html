<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layouts/layout :: layout(content = ~{::content}, htmlType = 'steam', title = ${'Steam 游戏库 | ' + site.title}, head = ~{::head})}">
<th:block th:fragment="head">
    <th:block th:replace="~{modules/common/open-graph :: open-graph(_title = 'Steam 游戏库',
                _permalink = '/steam',
                _cover = ${theme.config.other.opengraph.image},
                _excerpt = 'Steam 游戏库、最近游玩和游戏时长统计',
                _type = 'website')}"></th:block>
    <link rel="stylesheet" th:href="${assets_link + '/css/steam-diy.css' + theme_version}">
</th:block>

<th:block th:fragment="content">
    <div class="page steam-body-wrap" id="body-wrap">
        <header class="not-top-img" id="page-header">
            <nav th:replace="~{modules/nav :: nav(title = 'Steam 游戏库')}"></nav>
        </header>

        <main class="layout hide-aside" id="content-inner">
            <div id="page">
                <div class="steam-page" id="steam-page" data-steam-page>

                    <div class="steam-alert" id="steam-alert" hidden>
                        ⚠ Steam 数据加载失败。请检查插件配置、Steam 隐私设置，或稍后刷新重试。
                    </div>

                    <section class="steam-card steam-hero">
                        <div class="steam-hero-inner">
                            <div class="steam-profile">
                                <div class="steam-avatar-wrap">
                                    <img class="steam-avatar" id="steam-avatar" alt="Steam Avatar" src="/themes/theme-hao/assets/images/hao-logo.jpg">
                                    <span class="steam-status-dot" id="steam-status-dot"></span>
                                </div>
                                <div class="steam-profile-info">
                                    <div class="steam-kicker">🎮 Steam 游戏库</div>
                                    <h1 class="steam-title" id="steam-persona-name">Steam User</h1>
                                    <div class="steam-meta">
                                        <span id="steam-status-text">加载中...</span>
                                        <span class="steam-pill level" id="steam-level">Lv. 0</span>
                                        <span class="steam-pill" id="steam-badges">0 徽章</span>
                                        <span class="steam-pill" id="steam-xp">0 XP</span>
                                    </div>
                                </div>
                            </div>
                            <a class="steam-action" id="steam-profile-link" href="javascript:void(0)" target="_blank" rel="noopener external nofollow noreferrer">访问 Steam</a>
                        </div>
                    </section>

                    <section class="steam-stat-grid">
                        <div class="steam-stat-card">
                            <span class="steam-stat-value" id="steam-total-games">--</span>
                            <span class="steam-stat-label">游戏总数</span>
                        </div>
                        <div class="steam-stat-card">
                            <span class="steam-stat-value" id="steam-total-playtime">--</span>
                            <span class="steam-stat-label">总游玩时长</span>
                        </div>
                        <div class="steam-stat-card">
                            <span class="steam-stat-value" id="steam-recent-playtime">--</span>
                            <span class="steam-stat-label">最近两周</span>
                        </div>
                    </section>

                    <section class="steam-section">
                        <div class="steam-section-header">
                            <h2 class="steam-section-title">▦ 游戏时长热力图</h2>
                            <span class="steam-section-desc">最近 365 天游戏时长统计</span>
                        </div>
                        <div class="steam-card steam-heatmap-card">
                            <div id="steam-heatmap" class="steam-heatmap" data-days="365" data-legend="true">
                                <div class="steam-heatmap-loading">加载热力图数据中...</div>
                            </div>
                        </div>
                    </section>

                    <section class="steam-section">
                        <div class="steam-section-header">
                            <h2 class="steam-section-title">🎮 最近游玩</h2>
                            <span class="steam-section-desc">显示最近两周的游戏记录</span>
                        </div>
                        <div class="steam-games-grid recent" id="steam-recent-games">
                            <div class="steam-empty">正在加载最近游玩...</div>
                        </div>
                    </section>

                    <section class="steam-section">
                        <div class="steam-section-header">
                            <h2 class="steam-section-title">▣ 游戏库</h2>
                            <span class="steam-section-desc" id="steam-games-desc">全部游戏 · 按游玩时长排序</span>
                        </div>
                        <div class="steam-games-grid" id="steam-owned-games">
                            <div class="steam-empty">正在加载游戏库...</div>
                        </div>
                        <nav class="steam-pagination" id="steam-pagination" hidden></nav>
                    </section>
                </div>
            </div>
        </main>

        <footer th:replace="~{modules/footer :: footer}"></footer>
        <script th:if="${theme.config.other.bubbleEnable}" async data-pjax th:src="${assets_link + '/libs/canvas/bubble.js'}"></script>
        <script defer data-pjax th:src="${assets_link + '/js/steam-diy.js' + theme_version}"></script>
    </div>
</th:block>
</html>
