<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layouts/layout :: layout(content = ~{::content},htmlType = 'photos',title = ${title + ' | ' + site.title}, head = ~{::head},_title = ${title})}">
<th:block th:fragment="head">
    <th:block th:replace="~{modules/common/open-graph :: open-graph(_title = ${_title},
                _permalink = '/photos',
                _cover = ${theme.config.other.opengraph.image},
                _excerpt = ${site.seo.description},
                _type = 'website')}"></th:block>
</th:block>
<th:block th:fragment="content">

    <div class="page" id="body-wrap">
        <!-- 头部导航栏 -->
        <header class="not-top-img" id="page-header">
            <nav th:replace="~{modules/nav :: nav(title = ${_title})}"></nav>
        </header>
        <main class="layout hide-aside" id="content-inner">
            <div id="page">
                <th:block th:if="${#strings.equals(theme.config.photos.photosStyle, 'default')}">
                    <th:block th:each="group : ${photoFinder.groupBy()}">
                        <th:block
                                th:if="${#strings.equals(group.metadata.name, param.group) && not #strings.isEmpty(param.group)}"
                                th:with="description = ${#annotations.get(group, 'description')},
                         background = ${#annotations.get(group, 'background')}">
                            <div th:replace="~{macro/author-content :: author-content-video(
        background = ${background},
        video = ${!#strings.isEmpty(theme.config.photos.backgroundVideo) ? theme.config.photos.backgroundVideo : ''},
        smallTitle = '相册集',
        bigTitle = ${group.spec.displayName},
        detail = ${description},
        buttonUrl = ${theme.config.photos.topLink},
        buttonTitle = '返回'
)}"></div>
                        </th:block>
                    </th:block>
                    <th:block th:if="${#strings.isEmpty(param.group)}"
                              th:with="background = ${theme.config.photos.backgroundImg}">
                        <div th:replace="~{macro/author-content :: author-content-video(
        background = ${background},
        video = ${!#strings.isEmpty(theme.config.photos.backgroundVideo) ? theme.config.photos.backgroundVideo : ''},
        smallTitle = '相册集',
        bigTitle = '全部',
        detail = '',
        buttonUrl = ${theme.config.photos.topLink},
        buttonTitle = '返回'
)}"></div>
                    </th:block>
                    <div id="article-container">
                        <section class="page-1 loadings">
                            <div class="type-gallery ">
                                <div class="gallery photo-page-gallery" data-page-size="20"></div>

<template class="photo-page-source">
    <div class="fj-gallery-item" th:each="photo : ${photos.items}">
        <div th:if="${theme.config.photos.tagEnable}" class="tag-address">
            [[${photo.spec.displayName}]]
        </div>
        <img th:src="${photo.spec.url}" th:alt="${photo.spec.description}"
             th:title="${photo.spec.description}">
    </div>
</template>

<nav class="photo-pagination" style="display:none;">
    <a class="photo-page-btn photo-prev" href="javascript:void(0)">上一页</a>

    <span class="photo-page-num">
        <span class="photo-current">1</span>
        <span>/</span>
        <span class="photo-total">1</span>
    </span>

    <a class="photo-page-btn photo-next" href="javascript:void(0)">下一页</a>
</nav>
                            </div>
                        </section>
                    </div>
                </th:block>

                <div class="gallery-groups" th:if="${#strings.equals(theme.config.photos.photosStyle, 'one')}">
                    <th:block th:each="group : ${photoFinder.groupBy()}">
                        <h1 style="margin: 8px 0px 20px" th:if="${#strings.equals(group.metadata.name, param.group) && not #strings.isEmpty(param.group) }">
                            [[${group.spec.displayName}]]
                        </h1>
                        <h1 style="margin: 8px 0px 20px" th:if="${#strings.isEmpty(param.group) }">
                            全部
                        </h1>
                    </th:block>
                    <div id="article-container">
                        <section class="page-1 loadings">
                            <div class="type-gallery ">


                                <div class="gallery photo-page-gallery" data-page-size="20"></div>

<template class="photo-page-source">
    <div class="fj-gallery-item" th:each="photo : ${photos.items}">
        <div th:if="${theme.config.photos.tagEnable}" class="tag-address">
            [[${photo.spec.displayName}]]
        </div>
        <img th:src="${photo.spec.url}" th:alt="${photo.spec.description}"
             th:title="${photo.spec.description}">
    </div>
</template>

<nav class="photo-pagination" style="display:none;">
    <a class="photo-page-btn photo-prev" href="javascript:void(0)">上一页</a>

    <span class="photo-page-num">
        <span class="photo-current">1</span>
        <span>/</span>
        <span class="photo-total">1</span>
    </span>

    <a class="photo-page-btn photo-next" href="javascript:void(0)">下一页</a>
</nav>
                            </div>
                        </section>
                    </div>
                </div>
                <style>
                    .gallery-groups {
                        box-shadow: var(--heo-shadow-border);
                        padding: 1rem 2rem;
                        border-radius: 12px;
                        background: var(--heo-card-bg);
                        border: var(--style-border);
                        width: 100%;
                        align-self: flex-start;
                        animation: slide-in 0.6s 0.1s backwards;
                    }

                    #content-inner .loadings .type-gallery {
                        opacity: 0
                    }

                    .loadings {
                        height: 60px;
                        background-position: center;
                        background-repeat: no-repeat;
                        color: #504e4e;
                        border: none;
                        background-size: auto 100%;
                        box-shadow: none;
                        background-color: inherit;
                        background-image: none;
                        background-image: url(/themes/theme-hao/assets/images/load/rotating-ball-o.svg)
                    }

                    #article-container .type-gallery {
                        overflow: hidden;
                        margin-top: 40px;
                    }

                    #content-inner .gallery {
                        margin: 0 0 16px;
                        text-align: center
                    }

                    #content-inner .gallery .fj-gallery {
                        opacity: 0;
                        -ms-filter: "progid:DXImageTransform.Microsoft.Alpha(Opacity=0)";
                        filter: alpha(opacity=0)
                    }

                    #content-inner .gallery .fj-gallery .img-alt {
                        display: none
                    }

                    #content-inner .gallery .fj-gallery.lazyload+button {
                        display: inline-block
                    }

                    #content-inner .gallery .fj-gallery .gallery-data {
                        opacity: 0;
                        -ms-filter: "progid:DXImageTransform.Microsoft.Alpha(Opacity=0)";
                        filter: alpha(opacity=0);
                        visibility: hidden
                    }

                    #content-inner .gallery button {
                        display: none;
                        margin-top: 25px;
                        padding: 10px;
                        width: 9em;
                        border-radius: 5px;
                        background: var(--btn-bg);
                        color: var(--btn-color);
                        font-weight: 700;
                        font-size: 1.1em;
                        -webkit-transition: all .3s;
                        -moz-transition: all .3s;
                        -o-transition: all .3s;
                        -ms-transition: all .3s;
                        transition: all .3s
                    }

                    #content-inner .gallery button>* {
                        -webkit-transition: all .4s;
                        -moz-transition: all .4s;
                        -o-transition: all .4s;
                        -ms-transition: all .4s;
                        transition: all .4s
                    }

                    #content-inner .gallery button i {
                        opacity: 1;
                        -ms-filter: none;
                        filter: none;
                        font-size: 1.1rem
                    }

                    #content-inner .gallery button:hover {
                        background: var(--btn-hover-color)
                    }

                    #content-inner .gallery button:hover i {
                        margin-left: 2px
                    }

                    #article-container .tag-address {
                        display: flex;
                        position: absolute;
                        left: 8px;
                        top: 8px;
                        padding: 4px 6px;
                        border-radius: 8px;
                        background: var(--heo-black-op);
                        font-size: 12px;
                        color: var(--heo-white);
                        transition: .3s;
                        z-index: 1;
                        user-select: none
                    }

                    img {
                        border-style: none;
                        border-radius: 8px;
                        max-width: 100%;
                        transition: all .2s ease 0s;
                        -webkit-user-drag: none;
                        -khtml-user-drag: none;
                        -moz-user-drag: none;
                        -ms-user-drag: none;
                        -user-drag: none
                    }
                </style>

                <script data-pjax>
    (function () {
        function unwrapFancybox(root) {
            root.querySelectorAll('a.fancybox > img').forEach(function (img) {
                const a = img.parentNode;
                a.parentNode.replaceChild(img, a);
            });
        }

        function waitImages(gallery, callback) {
            const imgs = Array.from(gallery.querySelectorAll('img'));

            if (!imgs.length) {
                callback();
                return;
            }

            let rest = imgs.length;
            let done = false;

            function finishOne() {
                if (done) return;
                rest--;

                if (rest <= 0) {
                    done = true;
                    callback();
                }
            }

            imgs.forEach(function (img) {
                if (img.complete && img.naturalWidth > 0) {
                    finishOne();
                } else {
                    img.addEventListener('load', finishOne, { once: true });
                    img.addEventListener('error', finishOne, { once: true });
                }
            });

            setTimeout(function () {
                if (!done) {
                    done = true;
                    callback();
                }
            }, 2500);
        }

        function resetGallery(gallery) {
            gallery.className = 'gallery photo-page-gallery';
            gallery.removeAttribute('style');

            gallery.querySelectorAll('.fj-gallery-item').forEach(function (item) {
                item.className = 'fj-gallery-item';
                item.removeAttribute('style');
            });

            gallery.querySelectorAll('[style]').forEach(function (el) {
                el.removeAttribute('style');
            });

            unwrapFancybox(gallery);

            const section = gallery.closest('.loadings');
            if (section) {
                section.classList.remove('loadings');
            }

            const typeGallery = gallery.closest('.type-gallery');
            if (typeGallery) {
                typeGallery.style.opacity = '1';
            }
        }

        function layoutGallery(gallery) {
    resetGallery(gallery);

    gallery.classList.add('photo-gallery-loading');

    if (window.lazyLoadInstance && typeof window.lazyLoadInstance.update === 'function') {
        window.lazyLoadInstance.update();
    }

    waitImages(gallery, function () {
        function runJustifiedGallery() {
            gallery.className = 'gallery photo-page-gallery photo-gallery-loading';
            gallery.removeAttribute('style');

            if (window.btf && typeof btf.initJustifiedGallerys === 'function') {
                btf.initJustifiedGallerys([gallery]);
            }
        }

        function initLightboxAndRelayout() {
            if (window.btf && typeof btf.loadLightbox === 'function') {
                unwrapFancybox(gallery);
                btf.loadLightbox(gallery.querySelectorAll('.fj-gallery-item > img'));
            }

            // fancybox 包裹图片后，再重新排一次图库，防止变成大图
            setTimeout(runJustifiedGallery, 80);
            setTimeout(runJustifiedGallery, 300);
            setTimeout(runJustifiedGallery, 700);

            setTimeout(function () {
                gallery.classList.remove('photo-gallery-loading');
            }, 900);
        }

        // 先排版
        runJustifiedGallery();
        setTimeout(runJustifiedGallery, 200);

        // 再初始化灯箱，然后重新排版
        setTimeout(initLightboxAndRelayout, 450);

        // 兜底，避免异常时一直隐藏
        setTimeout(function () {
            gallery.classList.remove('photo-gallery-loading');
        }, 1800);
    });
}

        function renderPhotoPage(gallery, page) {
            const allHtml = gallery.__photoAllHtml || [];
            const pageSize = gallery.__photoPageSize || 20;
            const totalPages = Math.max(1, Math.ceil(allHtml.length / pageSize));

            page = Math.max(1, Math.min(page, totalPages));
            gallery.__photoCurrentPage = page;

            const start = (page - 1) * pageSize;
            const end = start + pageSize;

            gallery.innerHTML = allHtml.slice(start, end).join('');

            const wrapper = gallery.parentElement;
            const pagination = wrapper.querySelector('.photo-pagination');

            if (pagination) {
                const currentEl = pagination.querySelector('.photo-current');
                const totalEl = pagination.querySelector('.photo-total');
                const prevBtn = pagination.querySelector('.photo-prev');
                const nextBtn = pagination.querySelector('.photo-next');

                if (currentEl) currentEl.textContent = page;
                if (totalEl) totalEl.textContent = totalPages;

                if (prevBtn) prevBtn.classList.toggle('disabled', page <= 1);
                if (nextBtn) nextBtn.classList.toggle('disabled', page >= totalPages);

                pagination.style.display = totalPages > 1 ? 'flex' : 'none';
            }

            layoutGallery(gallery);
        }

        function initPhotoPagination() {
            document.querySelectorAll('.photo-page-gallery').forEach(function (gallery) {
                if (gallery.dataset.photoPaginationReady === 'true') return;

                const wrapper = gallery.parentElement;
                const source = wrapper.querySelector('.photo-page-source');
                const pagination = wrapper.querySelector('.photo-pagination');

                if (!source || !pagination || !source.content) return;

                const items = Array.from(source.content.querySelectorAll('.fj-gallery-item'));
                if (!items.length) return;

                gallery.__photoAllHtml = items.map(function (item) {
                    const clone = item.cloneNode(true);
                    clone.removeAttribute('style');
                    clone.querySelectorAll('[style]').forEach(function (el) {
                        el.removeAttribute('style');
                    });
                    unwrapFancybox(clone);
                    return clone.outerHTML;
                });

                gallery.__photoPageSize = Number(gallery.dataset.pageSize || 20);
                gallery.__photoCurrentPage = 1;

                gallery.dataset.photoPaginationReady = 'true';

                renderPhotoPage(gallery, 1);
            });
        }

        if (!window.__haoPhotoPaginationBinded) {
            window.__haoPhotoPaginationBinded = true;

            document.addEventListener('click', function (e) {
                const btn = e.target.closest('.photo-pagination .photo-page-btn');
                if (!btn || btn.classList.contains('disabled')) return;

                e.preventDefault();

                const wrapper = btn.closest('.type-gallery');
                if (!wrapper) return;

                const gallery = wrapper.querySelector('.photo-page-gallery');
                if (!gallery) return;

                const current = gallery.__photoCurrentPage || 1;

                if (btn.classList.contains('photo-prev')) {
                    renderPhotoPage(gallery, current - 1);
                }

                if (btn.classList.contains('photo-next')) {
                    renderPhotoPage(gallery, current + 1);
                }
            });

            let resizeTimer = null;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function () {
                    document.querySelectorAll('.photo-page-gallery').forEach(function (gallery) {
                        if (gallery.dataset.photoPaginationReady === 'true') {
                            layoutGallery(gallery);
                        }
                    });
                }, 300);
            });
        }

        function bootPhotoPagination() {
            setTimeout(initPhotoPagination, 0);
            setTimeout(initPhotoPagination, 300);
            setTimeout(initPhotoPagination, 800);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootPhotoPagination);
        } else {
            bootPhotoPagination();
        }

        document.addEventListener('pjax:complete', bootPhotoPagination);
    })();
</script>
                <!--/* 评论组件 */-->
                <th:block th:replace="~{modules/comment :: comment(group = 'content.halo.run',
                  kind = 'SinglePage',
                  name = 'photos',
                  allowComment = true)}" />
            </div>

        </main>
        <!-- 底部 -->
        <footer th:replace="~{modules/footer :: footer}"></footer>
        <!-- 卡片顶部气泡效果 -->
        <script th:if="${theme.config.other.bubbleEnable}" async data-pjax
                th:src="${assets_link + '/libs/canvas/bubble.js'}"></script>
    </div>

</th:block>

</html>
