<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layouts/layout :: layout(content = ~{::content},htmlType = 'photos',title = ${title + ' | ' + site.title}, head = ~{::head},_title = ${title})}">
<th:block th:fragment="head">
    <th:block th:replace="~{modules/common/open-graph :: open-graph(_title = ${_title},
                _permalink = '/photos',
                _cover = ${theme.config.other.opengraph.image},
                _excerpt = ${site.seo.description},
                _type = 'website')}"></th:block>
</th:block>
<th:block th:fragment="content">

    <div class="page" id="body-wrap">
        <!-- 头部导航栏 -->
        <header class="not-top-img" id="page-header">
            <nav th:replace="~{modules/nav :: nav(title = ${_title})}"></nav>
        </header>
        <main class="layout hide-aside" id="content-inner">
            <div id="page">
                <th:block th:if="${#strings.equals(theme.config.photos.photosStyle, 'default')}">
                    <th:block th:each="group : ${photoFinder.groupBy()}">
                        <th:block
                                th:if="${#strings.equals(group.metadata.name, param.group) && not #strings.isEmpty(param.group)}"
                                th:with="description = ${#annotations.get(group, 'description')},
                         background = ${#annotations.get(group, 'background')}">
                            <div th:replace="~{macro/author-content :: author-content-video(
        background = ${background},
        video = ${!#strings.isEmpty(theme.config.photos.backgroundVideo) ? theme.config.photos.backgroundVideo : ''},
        smallTitle = '相册集',
        bigTitle = ${group.spec.displayName},
        detail = ${description},
        buttonUrl = ${theme.config.photos.topLink},
        buttonTitle = '返回'
)}"></div>
                        </th:block>
                    </th:block>
                    <th:block th:if="${#strings.isEmpty(param.group)}"
                              th:with="background = ${theme.config.photos.backgroundImg}">
                        <div th:replace="~{macro/author-content :: author-content-video(
        background = ${background},
        video = ${!#strings.isEmpty(theme.config.photos.backgroundVideo) ? theme.config.photos.backgroundVideo : ''},
        smallTitle = '相册集',
        bigTitle = '全部',
        detail = '',
        buttonUrl = ${theme.config.photos.topLink},
        buttonTitle = '返回'
)}"></div>
                    </th:block>
                    <div id="article-container">
                        <section class="page-1 loadings">
                            <div class="type-gallery ">
                                <div class="photo-page-gallery" data-page-size="20">
    <div class="fj-gallery-item" th:each="photo : ${photos.items}">
        <div th:if="${theme.config.photos.tagEnable}" class="tag-address">
            [[${photo.spec.displayName}]]
        </div>
        <img th:src="${photo.spec.url}" th:alt="${photo.spec.description}"
             th:title="${photo.spec.description}">
    </div>
</div>

<nav class="photo-pagination" style="display:none;">
    <a class="photo-page-btn photo-prev" href="javascript:void(0)">上一页</a>

    <span class="photo-page-num">
        <span class="photo-current">1</span>
        <span>/</span>
        <span class="photo-total">1</span>
    </span>

    <a class="photo-page-btn photo-next" href="javascript:void(0)">下一页</a>
</nav>
                            </div>
                        </section>
                    </div>
                </th:block>

                <div class="gallery-groups" th:if="${#strings.equals(theme.config.photos.photosStyle, 'one')}">
                    <th:block th:each="group : ${photoFinder.groupBy()}">
                        <h1 style="margin: 8px 0px 20px" th:if="${#strings.equals(group.metadata.name, param.group) && not #strings.isEmpty(param.group) }">
                            [[${group.spec.displayName}]]
                        </h1>
                        <h1 style="margin: 8px 0px 20px" th:if="${#strings.isEmpty(param.group) }">
                            全部
                        </h1>
                    </th:block>
                    <div id="article-container">
                        <section class="page-1 loadings">
                            <div class="type-gallery ">
                                <div class="photo-page-gallery" data-page-size="20">
    <div class="fj-gallery-item" th:each="photo : ${photos.items}">
        <div th:if="${theme.config.photos.tagEnable}" class="tag-address">
            [[${photo.spec.displayName}]]
        </div>
        <img th:src="${photo.spec.url}" th:alt="${photo.spec.description}"
             th:title="${photo.spec.description}">
    </div>
</div>

<nav class="photo-pagination" style="display:none;">
    <a class="photo-page-btn photo-prev" href="javascript:void(0)">上一页</a>

    <span class="photo-page-num">
        <span class="photo-current">1</span>
        <span>/</span>
        <span class="photo-total">1</span>
    </span>

    <a class="photo-page-btn photo-next" href="javascript:void(0)">下一页</a>
</nav>
                            </div>
                        </section>
                    </div>
                </div>
                <style>
                    .gallery-groups {
                        box-shadow: var(--heo-shadow-border);
                        padding: 1rem 2rem;
                        border-radius: 12px;
                        background: var(--heo-card-bg);
                        border: var(--style-border);
                        width: 100%;
                        align-self: flex-start;
                        animation: slide-in 0.6s 0.1s backwards;
                    }

                    #content-inner .loadings .type-gallery {
                        opacity: 0
                    }

                    .loadings {
                        height: 60px;
                        background-position: center;
                        background-repeat: no-repeat;
                        color: #504e4e;
                        border: none;
                        background-size: auto 100%;
                        box-shadow: none;
                        background-color: inherit;
                        background-image: none;
                        background-image: url(/themes/theme-hao/assets/images/load/rotating-ball-o.svg)
                    }

                    #article-container .type-gallery {
                        overflow: hidden;
                        margin-top: 40px;
                    }

                    #content-inner .gallery {
                        margin: 0 0 16px;
                        text-align: center
                    }

                    #content-inner .gallery .fj-gallery {
                        opacity: 0;
                        -ms-filter: "progid:DXImageTransform.Microsoft.Alpha(Opacity=0)";
                        filter: alpha(opacity=0)
                    }

                    #content-inner .gallery .fj-gallery .img-alt {
                        display: none
                    }

                    #content-inner .gallery .fj-gallery.lazyload+button {
                        display: inline-block
                    }

                    #content-inner .gallery .fj-gallery .gallery-data {
                        opacity: 0;
                        -ms-filter: "progid:DXImageTransform.Microsoft.Alpha(Opacity=0)";
                        filter: alpha(opacity=0);
                        visibility: hidden
                    }

                    #content-inner .gallery button {
                        display: none;
                        margin-top: 25px;
                        padding: 10px;
                        width: 9em;
                        border-radius: 5px;
                        background: var(--btn-bg);
                        color: var(--btn-color);
                        font-weight: 700;
                        font-size: 1.1em;
                        -webkit-transition: all .3s;
                        -moz-transition: all .3s;
                        -o-transition: all .3s;
                        -ms-transition: all .3s;
                        transition: all .3s
                    }

                    #content-inner .gallery button>* {
                        -webkit-transition: all .4s;
                        -moz-transition: all .4s;
                        -o-transition: all .4s;
                        -ms-transition: all .4s;
                        transition: all .4s
                    }

                    #content-inner .gallery button i {
                        opacity: 1;
                        -ms-filter: none;
                        filter: none;
                        font-size: 1.1rem
                    }

                    #content-inner .gallery button:hover {
                        background: var(--btn-hover-color)
                    }

                    #content-inner .gallery button:hover i {
                        margin-left: 2px
                    }

                    #article-container .tag-address {
                        display: flex;
                        position: absolute;
                        left: 8px;
                        top: 8px;
                        padding: 4px 6px;
                        border-radius: 8px;
                        background: var(--heo-black-op);
                        font-size: 12px;
                        color: var(--heo-white);
                        transition: .3s;
                        z-index: 1;
                        user-select: none
                    }

                    img {
                        border-style: none;
                        border-radius: 8px;
                        max-width: 100%;
                        transition: all .2s ease 0s;
                        -webkit-user-drag: none;
                        -khtml-user-drag: none;
                        -moz-user-drag: none;
                        -ms-user-drag: none;
                        -user-drag: none
                    }
                </style>

                <script data-pjax>
    (function () {
        function unwrapFancybox(root) {
            root.querySelectorAll('a.fancybox > img').forEach(function (img) {
                const a = img.parentNode;
                a.parentNode.replaceChild(img, a);
            });
        }

        function cleanPhotoItem(item) {
            const clone = item.cloneNode(true);

            clone.className = 'fj-gallery-item';
            clone.removeAttribute('style');

            clone.querySelectorAll('[style]').forEach(function (el) {
                el.removeAttribute('style');
            });

            unwrapFancybox(clone);

            return clone.outerHTML;
        }

        function ensureJustifiedGallery(callback) {
            if (window.fjGallery && window.btf && typeof btf.initJustifiedGallerys === 'function') {
                callback();
                return;
            }

            if (!window.GLOBAL_CONFIG || !GLOBAL_CONFIG.source || !GLOBAL_CONFIG.source.justifiedGallery) {
                setTimeout(function () {
                    ensureJustifiedGallery(callback);
                }, 200);
                return;
            }

            if (!document.querySelector('link[data-photo-jg-css]')) {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.type = 'text/css';
                link.href = GLOBAL_CONFIG.source.justifiedGallery.css;
                link.setAttribute('data-photo-jg-css', 'true');
                document.head.appendChild(link);
            }

            if (window.__photoJgLoading) {
                window.__photoJgCallbacks = window.__photoJgCallbacks || [];
                window.__photoJgCallbacks.push(callback);
                return;
            }

            window.__photoJgLoading = true;
            window.__photoJgCallbacks = [callback];

            if (window.jQuery) {
                jQuery.getScript(GLOBAL_CONFIG.source.justifiedGallery.js, function () {
                    window.__photoJgLoading = false;
                    const callbacks = window.__photoJgCallbacks || [];
                    window.__photoJgCallbacks = [];
                    callbacks.forEach(function (fn) {
                        fn();
                    });
                });
            } else {
                setTimeout(function () {
                    window.__photoJgLoading = false;
                    ensureJustifiedGallery(callback);
                }, 300);
            }
        }

        function initLightbox(gallery) {
            unwrapFancybox(gallery);

            if (window.btf && typeof btf.loadLightbox === 'function') {
                btf.loadLightbox(gallery.querySelectorAll('.fj-gallery-item > img'));
            }
        }

        function resetGalleryBeforeLayout(gallery) {
    gallery.className = 'photo-page-gallery';
    gallery.removeAttribute('style');

    gallery.querySelectorAll('.fj-gallery-item').forEach(function (item) {
        item.className = 'fj-gallery-item';
        item.removeAttribute('style');
    });

    gallery.querySelectorAll('img').forEach(function (img) {
        img.removeAttribute('style');
    });

    const section = gallery.closest('section');
    if (section) {
        section.classList.remove('loadings');
    }

    const typeGallery = gallery.closest('.type-gallery');
    if (typeGallery) {
        typeGallery.style.opacity = '1';
    }
}
        function waitGalleryImages(gallery, callback) {
    const imgs = Array.from(gallery.querySelectorAll('img'));

    if (!imgs.length) {
        callback();
        return;
    }

    let rest = imgs.length;
    let finished = false;

    function doneOne() {
        if (finished) return;

        rest--;

        if (rest <= 0) {
            finished = true;
            callback();
        }
    }

    imgs.forEach(function (img) {
        if (img.complete && img.naturalWidth > 0) {
            doneOne();
        } else {
            img.addEventListener('load', doneOne, { once: true });
            img.addEventListener('error', doneOne, { once: true });
        }
    });

    // 兜底：避免某张图加载失败导致一直不初始化
    setTimeout(function () {
        if (!finished) {
            finished = true;
            callback();
        }
    }, 2500);
}

        function reInitPhotoGallery(gallery) {
    resetGalleryBeforeLayout(gallery);

    if (window.lazyLoadInstance && typeof window.lazyLoadInstance.update === 'function') {
        window.lazyLoadInstance.update();
    }

    waitGalleryImages(gallery, function () {
        // 这里只初始化灯箱，不再调用 btf.initJustifiedGallerys
        setTimeout(function () {
            initLightbox(gallery);
        }, 50);

        setTimeout(function () {
            initLightbox(gallery);
        }, 300);
    });
}
            function runLayout() {
                if (window.btf && typeof btf.initJustifiedGallerys === 'function') {
                    btf.initJustifiedGallerys([gallery]);
                }
            }

            // 图片加载完成后再计算图库布局
            runLayout();

            // 再延迟计算几次，防止浏览器刚渲染时尺寸还没稳定
            setTimeout(runLayout, 200);
            setTimeout(runLayout, 600);

            // 等布局稳定后再初始化灯箱，避免图片被包裹后影响布局计算
            setTimeout(function () {
                initLightbox(gallery);
            }, 800);
        });
    });
}

        function initPhotoPagination() {
            document.querySelectorAll('.photo-page-gallery').forEach(function (gallery) {
                if (gallery.dataset.photoPaginationReady === 'true') {
                    return;
                }

                const pagination = gallery.parentElement.querySelector('.photo-pagination');
                if (!pagination) return;

                const rawItems = Array.from(gallery.querySelectorAll('.fj-gallery-item'));
                if (!rawItems.length) return;

                const allHtml = rawItems.map(cleanPhotoItem);
                const pageSize = Number(gallery.dataset.pageSize || 20);
                const totalPages = Math.ceil(allHtml.length / pageSize);

                let currentPage = 1;

                const prevBtn = pagination.querySelector('.photo-prev');
                const nextBtn = pagination.querySelector('.photo-next');
                const currentEl = pagination.querySelector('.photo-current');
                const totalEl = pagination.querySelector('.photo-total');

                gallery.dataset.photoPaginationReady = 'true';

                if (totalEl) {
                    totalEl.textContent = totalPages;
                }

                if (totalPages <= 1) {
                    pagination.style.display = 'none';
                } else {
                    pagination.style.display = 'flex';
                }

                function render(page) {
                    currentPage = Math.max(1, Math.min(page, totalPages));

                    const start = (currentPage - 1) * pageSize;
                    const end = start + pageSize;

                    gallery.innerHTML = allHtml.slice(start, end).join('');

                    if (currentEl) {
                        currentEl.textContent = currentPage;
                    }

                    if (prevBtn) {
                        prevBtn.classList.toggle('disabled', currentPage <= 1);
                    }

                    if (nextBtn) {
                        nextBtn.classList.toggle('disabled', currentPage >= totalPages);
                    }

                    reInitPhotoGallery(gallery);
                }

                if (prevBtn) {
                    prevBtn.onclick = function () {
                        if (currentPage > 1) {
                            render(currentPage - 1);
                        }
                    };
                }

                if (nextBtn) {
                    nextBtn.onclick = function () {
                        if (currentPage < totalPages) {
                            render(currentPage + 1);
                        }
                    };
                }

                render(1);
            });
        }

        function relayoutPhotoGalleries() {
    document.querySelectorAll('.photo-page-gallery').forEach(function (gallery) {
        if (gallery.dataset.photoPaginationReady === 'true') {
            reInitPhotoGallery(gallery);
        }
    });
}

function bootPhotoPagination() {
    setTimeout(initPhotoPagination, 0);
    setTimeout(initPhotoPagination, 300);
    setTimeout(initPhotoPagination, 800);

    // 首次进入页面时，等图片基本加载后再重排一次
    setTimeout(relayoutPhotoGalleries, 1500);
    setTimeout(relayoutPhotoGalleries, 3000);
}

        if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootPhotoPagination);
} else {
    bootPhotoPagination();
}

window.addEventListener('load', function () {
    setTimeout(relayoutPhotoGalleries, 300);
}, { once: true });

document.addEventListener('pjax:complete', bootPhotoPagination);
let photoResizeTimer = null;

window.addEventListener('resize', function () {
    clearTimeout(photoResizeTimer);

    photoResizeTimer = setTimeout(function () {
        document.querySelectorAll('.photo-page-gallery').forEach(function (gallery) {
            if (gallery.dataset.photoPaginationReady === 'true') {
                reInitPhotoGallery(gallery);
            }
        });
    }, 300);
});
    })();
</script>
                <!--/* 评论组件 */-->
                <th:block th:replace="~{modules/comment :: comment(group = 'content.halo.run',
                  kind = 'SinglePage',
                  name = 'photos',
                  allowComment = true)}" />
            </div>

        </main>
        <!-- 底部 -->
        <footer th:replace="~{modules/footer :: footer}"></footer>
        <!-- 卡片顶部气泡效果 -->
        <script th:if="${theme.config.other.bubbleEnable}" async data-pjax
                th:src="${assets_link + '/libs/canvas/bubble.js'}"></script>
    </div>

</th:block>

</html>
