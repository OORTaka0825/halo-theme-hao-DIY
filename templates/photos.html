<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layouts/layout :: layout(content = ~{::content},htmlType = 'photos',title = ${title + ' | ' + site.title}, head = ~{::head},_title = ${title})}">
<th:block th:fragment="head">
    <th:block th:replace="~{modules/common/open-graph :: open-graph(_title = ${_title},
                _permalink = '/photos',
                _cover = ${theme.config.other.opengraph.image},
                _excerpt = ${site.seo.description},
                _type = 'website')}"></th:block>
</th:block>
<th:block th:fragment="content">

    <div class="page" id="body-wrap">
        <!-- 头部导航栏 -->
        <header class="not-top-img" id="page-header">
            <nav th:replace="~{modules/nav :: nav(title = ${_title})}"></nav>
        </header>
        <main class="layout hide-aside" id="content-inner">
            <div id="page">
                <th:block th:if="${#strings.equals(theme.config.photos.photosStyle, 'default')}">
                    <th:block th:each="group : ${photoFinder.groupBy()}">
                        <th:block
                                th:if="${#strings.equals(group.metadata.name, param.group) && not #strings.isEmpty(param.group)}"
                                th:with="description = ${#annotations.get(group, 'description')},
                         background = ${#annotations.get(group, 'background')}">
                            <div th:replace="~{macro/author-content :: author-content-video(
        background = ${background},
        video = ${!#strings.isEmpty(theme.config.photos.backgroundVideo) ? theme.config.photos.backgroundVideo : ''},
        smallTitle = '相册集',
        bigTitle = ${group.spec.displayName},
        detail = ${description},
        buttonUrl = ${theme.config.photos.topLink},
        buttonTitle = '返回'
)}"></div>
                        </th:block>
                    </th:block>
                    <th:block th:if="${#strings.isEmpty(param.group)}"
                              th:with="background = ${theme.config.photos.backgroundImg}">
                        <div th:replace="~{macro/author-content :: author-content-video(
        background = ${background},
        video = ${!#strings.isEmpty(theme.config.photos.backgroundVideo) ? theme.config.photos.backgroundVideo : ''},
        smallTitle = '相册集',
        bigTitle = '全部',
        detail = '',
        buttonUrl = ${theme.config.photos.topLink},
        buttonTitle = '返回'
)}"></div>
                    </th:block>
                    <div id="article-container">
                        <section class="page-1 loadings">
                            <div class="type-gallery ">
                                <div class="gallery photo-page-gallery photo-paging-wait" data-page-size="20">
                                    <div class="fj-gallery-item" th:each="photo : ${photos.items}">
                                        <div th:if="${theme.config.photos.tagEnable}" class="tag-address">
                                            [[${photo.spec.displayName}]]</div>
                                        <img th:src="${photo.spec.url}" th:alt="${photo.spec.description}"
                                             th:title="${photo.spec.description}">

                                    </div>
                                </div>
                                <nav class="photo-pagination" style="display:none;">
                                    <a class="photo-page-btn photo-prev" href="javascript:void(0)">上一页</a>
                                    <span class="photo-page-num">
                                        <span class="photo-current">1</span>
                                        <span>/</span>
                                        <span class="photo-total">1</span>
                                    </span>
                                    <a class="photo-page-btn photo-next" href="javascript:void(0)">下一页</a>
                                </nav>
                            </div>
                        </section>
                    </div>
                </th:block>

                <div class="gallery-groups" th:if="${#strings.equals(theme.config.photos.photosStyle, 'one')}">
                    <th:block th:each="group : ${photoFinder.groupBy()}">
                        <h1 style="margin: 8px 0px 20px" th:if="${#strings.equals(group.metadata.name, param.group) && not #strings.isEmpty(param.group) }">
                            [[${group.spec.displayName}]]
                        </h1>
                        <h1 style="margin: 8px 0px 20px" th:if="${#strings.isEmpty(param.group) }">
                            全部
                        </h1>
                    </th:block>
                    <div id="article-container">
                        <section class="page-1 loadings">
                            <div class="type-gallery ">
                                <div class="gallery photo-page-gallery photo-paging-wait" data-page-size="20">
                                    <div class="fj-gallery-item" th:each="photo : ${photos.items}">
                                        <div th:if="${theme.config.photos.tagEnable}" class="tag-address">
                                            [[${photo.spec.displayName}]]</div>
                                        <img th:src="${photo.spec.url}" th:alt="${photo.spec.description}"
                                             th:title="${photo.spec.description}">

                                    </div>
                                </div>
                                <nav class="photo-pagination" style="display:none;">
                                    <a class="photo-page-btn photo-prev" href="javascript:void(0)">上一页</a>
                                    <span class="photo-page-num">
                                        <span class="photo-current">1</span>
                                        <span>/</span>
                                        <span class="photo-total">1</span>
                                    </span>
                                    <a class="photo-page-btn photo-next" href="javascript:void(0)">下一页</a>
                                </nav>
                            </div>
                        </section>
                    </div>
                </div>
                <style>
                    .gallery-groups {
                        box-shadow: var(--heo-shadow-border);
                        padding: 1rem 2rem;
                        border-radius: 12px;
                        background: var(--heo-card-bg);
                        border: var(--style-border);
                        width: 100%;
                        align-self: flex-start;
                        animation: slide-in 0.6s 0.1s backwards;
                    }

                    #content-inner .loadings .type-gallery {
                        opacity: 0
                    }

                    .loadings {
                        height: 60px;
                        background-position: center;
                        background-repeat: no-repeat;
                        color: #504e4e;
                        border: none;
                        background-size: auto 100%;
                        box-shadow: none;
                        background-color: inherit;
                        background-image: none;
                        background-image: url(/themes/theme-hao/assets/images/load/rotating-ball-o.svg)
                    }

                    #article-container .type-gallery {
                        overflow: hidden;
                        margin-top: 40px;
                    }

                    #content-inner .gallery {
                        margin: 0 0 16px;
                        text-align: center
                    }

                    #content-inner .gallery .fj-gallery {
                        opacity: 0;
                        -ms-filter: "progid:DXImageTransform.Microsoft.Alpha(Opacity=0)";
                        filter: alpha(opacity=0)
                    }

                    #content-inner .gallery .fj-gallery .img-alt {
                        display: none
                    }

                    #content-inner .gallery .fj-gallery.lazyload+button {
                        display: inline-block
                    }

                    #content-inner .gallery .fj-gallery .gallery-data {
                        opacity: 0;
                        -ms-filter: "progid:DXImageTransform.Microsoft.Alpha(Opacity=0)";
                        filter: alpha(opacity=0);
                        visibility: hidden
                    }

                    #content-inner .gallery button {
                        display: none;
                        margin-top: 25px;
                        padding: 10px;
                        width: 9em;
                        border-radius: 5px;
                        background: var(--btn-bg);
                        color: var(--btn-color);
                        font-weight: 700;
                        font-size: 1.1em;
                        -webkit-transition: all .3s;
                        -moz-transition: all .3s;
                        -o-transition: all .3s;
                        -ms-transition: all .3s;
                        transition: all .3s
                    }

                    #content-inner .gallery button>* {
                        -webkit-transition: all .4s;
                        -moz-transition: all .4s;
                        -o-transition: all .4s;
                        -ms-transition: all .4s;
                        transition: all .4s
                    }

                    #content-inner .gallery button i {
                        opacity: 1;
                        -ms-filter: none;
                        filter: none;
                        font-size: 1.1rem
                    }

                    #content-inner .gallery button:hover {
                        background: var(--btn-hover-color)
                    }

                    #content-inner .gallery button:hover i {
                        margin-left: 2px
                    }

                    #article-container .tag-address {
                        display: flex;
                        position: absolute;
                        left: 8px;
                        top: 8px;
                        padding: 4px 6px;
                        border-radius: 8px;
                        background: var(--heo-black-op);
                        font-size: 12px;
                        color: var(--heo-white);
                        transition: .3s;
                        z-index: 1;
                        user-select: none
                    }

                    img {
                        border-style: none;
                        border-radius: 8px;
                        max-width: 100%;
                        transition: all .2s ease 0s;
                        -webkit-user-drag: none;
                        -khtml-user-drag: none;
                        -moz-user-drag: none;
                        -ms-user-drag: none;
                        -user-drag: none
                    }
                </style>

                <script data-pjax>
                    (function () {
                        const PAGE_READY_CLASS = 'photo-pagination-ready';

                        function getGalleries() {
                            return Array.from(document.querySelectorAll('#article-container .photo-page-gallery'));
                        }

                        function getItems(gallery) {
                            return Array.from(gallery.children).filter(function (item) {
                                return item.classList && item.classList.contains('fj-gallery-item');
                            });
                        }

                        function waitImages(gallery, callback) {
                            const imgs = Array.from(gallery.querySelectorAll('img'));
                            if (!imgs.length) {
                                callback();
                                return;
                            }

                            let rest = imgs.length;
                            let done = false;

                            function finishOne() {
                                if (done) return;
                                rest--;
                                if (rest <= 0) {
                                    done = true;
                                    callback();
                                }
                            }

                            imgs.forEach(function (img) {
                                if (img.complete && img.naturalWidth > 0) {
                                    finishOne();
                                } else {
                                    img.addEventListener('load', finishOne, { once: true });
                                    img.addEventListener('error', finishOne, { once: true });
                                }
                            });

                            setTimeout(function () {
                                if (!done) {
                                    done = true;
                                    callback();
                                }
                            }, 3000);
                        }

                        function ensureJQueryAndGallery(callback) {
                            if (window.btf && typeof btf.initJustifiedGallerys === 'function') {
                                callback();
                                return;
                            }
                            setTimeout(function () {
                                ensureJQueryAndGallery(callback);
                            }, 200);
                        }

                        function showAllForLayout(gallery) {
                            gallery.classList.add('photo-paging-wait');
                            gallery.classList.remove(PAGE_READY_CLASS);
                            gallery.removeAttribute('style');

                            getItems(gallery).forEach(function (item) {
                                item.style.display = '';
                                item.style.visibility = '';
                                item.style.opacity = '';
                                item.style.transform = '';
                                item.removeAttribute('data-photo-hidden');

                                // 先恢复上一次保存的原始排版，避免翻页后的 top 被带入重排
                                if (item.dataset.photoOriginalTop) item.style.top = item.dataset.photoOriginalTop + 'px';
                                if (item.dataset.photoOriginalLeft) item.style.left = item.dataset.photoOriginalLeft + 'px';
                                if (item.dataset.photoOriginalWidth) item.style.width = item.dataset.photoOriginalWidth + 'px';
                                if (item.dataset.photoOriginalHeight) item.style.height = item.dataset.photoOriginalHeight + 'px';
                            });
                        }

                        function readNumber(value, fallback) {
                            const num = parseFloat(String(value || '').replace('px', ''));
                            return Number.isFinite(num) ? num : fallback;
                        }

                        function captureLayoutAndBuildPages(gallery) {
                            const items = getItems(gallery);
                            const pageSize = Number(gallery.dataset.pageSize || 20);

                            items.forEach(function (item, index) {
                                const rect = item.getBoundingClientRect();
                                const top = readNumber(item.style.top, item.offsetTop || 0);
                                const left = readNumber(item.style.left, item.offsetLeft || 0);
                                const width = readNumber(item.style.width, rect.width || item.offsetWidth || 0);
                                const height = readNumber(item.style.height, rect.height || item.offsetHeight || 0);

                                item.dataset.photoIndex = String(index);
                                item.dataset.photoOriginalTop = String(top);
                                item.dataset.photoOriginalLeft = String(left);
                                item.dataset.photoOriginalWidth = String(width);
                                item.dataset.photoOriginalHeight = String(height);
                            });

                            // 按 JustifiedGallery 已经排好的“行”分页，避免一页切在半行造成左右/上下大空白
                            const rows = [];
                            items.forEach(function (item) {
                                const top = Math.round(readNumber(item.dataset.photoOriginalTop, 0));
                                let row = rows.find(function (r) { return Math.abs(r.top - top) <= 2; });
                                if (!row) {
                                    row = { top: top, items: [] };
                                    rows.push(row);
                                }
                                row.items.push(item);
                            });

                            rows.sort(function (a, b) { return a.top - b.top; });
                            rows.forEach(function (row) {
                                row.items.sort(function (a, b) {
                                    return readNumber(a.dataset.photoOriginalLeft, 0) - readNumber(b.dataset.photoOriginalLeft, 0);
                                });
                            });

                            const pages = [];
                            let current = [];
                            rows.forEach(function (row) {
                                if (current.length && current.length + row.items.length > pageSize) {
                                    pages.push(current);
                                    current = [];
                                }
                                current = current.concat(row.items);
                            });
                            if (current.length) pages.push(current);

                            gallery.__photoPages = pages.length ? pages : [items];
                            gallery.__photoPageSize = pageSize;
                        }

                        function updatePagination(gallery, currentPage, totalPages) {
                            const wrapper = gallery.closest('.type-gallery');
                            const pagination = wrapper && wrapper.querySelector('.photo-pagination');
                            if (!pagination) return;

                            const currentEl = pagination.querySelector('.photo-current');
                            const totalEl = pagination.querySelector('.photo-total');
                            const prevBtn = pagination.querySelector('.photo-prev');
                            const nextBtn = pagination.querySelector('.photo-next');

                            if (currentEl) currentEl.textContent = currentPage;
                            if (totalEl) totalEl.textContent = totalPages;
                            if (prevBtn) prevBtn.classList.toggle('disabled', currentPage <= 1);
                            if (nextBtn) nextBtn.classList.toggle('disabled', currentPage >= totalPages);

                            pagination.style.display = totalPages > 1 ? 'flex' : 'none';
                        }

                        function renderPhotoPage(gallery, page) {
                            const pages = gallery.__photoPages || [];
                            const totalPages = Math.max(1, pages.length);
                            const currentPage = Math.max(1, Math.min(page, totalPages));
                            const pageItems = pages[currentPage - 1] || [];
                            const pageSet = new Set(pageItems);

                            if (!pageItems.length) return;

                            let minTop = Infinity;
                            let maxBottom = 0;

                            pageItems.forEach(function (item) {
                                const top = readNumber(item.dataset.photoOriginalTop, 0);
                                const height = readNumber(item.dataset.photoOriginalHeight, item.offsetHeight || 0);
                                minTop = Math.min(minTop, top);
                                maxBottom = Math.max(maxBottom, top + height);
                            });

                            if (!Number.isFinite(minTop)) minTop = 0;

                            getItems(gallery).forEach(function (item) {
                                const originalTop = readNumber(item.dataset.photoOriginalTop, 0);
                                const originalLeft = readNumber(item.dataset.photoOriginalLeft, 0);
                                const originalWidth = readNumber(item.dataset.photoOriginalWidth, item.offsetWidth || 0);
                                const originalHeight = readNumber(item.dataset.photoOriginalHeight, item.offsetHeight || 0);

                                if (pageSet.has(item)) {
                                    item.style.display = '';
                                    item.style.visibility = '';
                                    item.style.position = 'absolute';
                                    item.style.top = (originalTop - minTop) + 'px';
                                    item.style.left = originalLeft + 'px';
                                    item.style.width = originalWidth + 'px';
                                    item.style.height = originalHeight + 'px';
                                    item.removeAttribute('data-photo-hidden');
                                } else {
                                    item.style.display = 'none';
                                    item.setAttribute('data-photo-hidden', 'true');
                                }
                            });

                            gallery.style.position = 'relative';
                            gallery.style.height = Math.max(60, maxBottom - minTop) + 'px';
                            gallery.style.opacity = '1';
                            gallery.classList.remove('photo-paging-wait');
                            gallery.classList.add(PAGE_READY_CLASS);
                            gallery.__photoCurrentPage = currentPage;

                            const section = gallery.closest('.loadings');
                            if (section) section.classList.remove('loadings');
                            const typeGallery = gallery.closest('.type-gallery');
                            if (typeGallery) typeGallery.style.opacity = '1';

                            updatePagination(gallery, currentPage, totalPages);
                        }

                        function prepareGallery(gallery, keepPage) {
                            if (gallery.dataset.photoPagingPreparing === 'true') return;
                            gallery.dataset.photoPagingPreparing = 'true';

                            const targetPage = keepPage || gallery.__photoCurrentPage || 1;

                            showAllForLayout(gallery);

                            waitImages(gallery, function () {
                                ensureJQueryAndGallery(function () {
                                    if (window.btf && typeof btf.initJustifiedGallerys === 'function') {
                                        btf.initJustifiedGallerys([gallery]);
                                    }

                                    setTimeout(function () {
                                        captureLayoutAndBuildPages(gallery);
                                        renderPhotoPage(gallery, targetPage);
                                        gallery.dataset.photoPaginationReady = 'true';
                                        gallery.dataset.photoPagingPreparing = 'false';
                                    }, 450);
                                });
                            });
                        }

                        function bootPhotoPagination() {
                            getGalleries().forEach(function (gallery) {
                                if (gallery.dataset.photoPaginationBooted === 'true') return;
                                gallery.dataset.photoPaginationBooted = 'true';
                                prepareGallery(gallery, 1);
                            });
                        }

                        if (!window.__haoPhotoPaginationV4Binded) {
                            window.__haoPhotoPaginationV4Binded = true;

                            document.addEventListener('click', function (e) {
                                const btn = e.target.closest('.photo-pagination .photo-page-btn');
                                if (!btn || btn.classList.contains('disabled')) return;

                                e.preventDefault();

                                const wrapper = btn.closest('.type-gallery');
                                const gallery = wrapper && wrapper.querySelector('.photo-page-gallery');
                                if (!gallery || !gallery.__photoPages) return;

                                const current = gallery.__photoCurrentPage || 1;
                                if (btn.classList.contains('photo-prev')) renderPhotoPage(gallery, current - 1);
                                if (btn.classList.contains('photo-next')) renderPhotoPage(gallery, current + 1);
                            });

                            let resizeTimer = null;
                            window.addEventListener('resize', function () {
                                clearTimeout(resizeTimer);
                                resizeTimer = setTimeout(function () {
                                    getGalleries().forEach(function (gallery) {
                                        if (gallery.dataset.photoPaginationReady === 'true') {
                                            prepareGallery(gallery, gallery.__photoCurrentPage || 1);
                                        }
                                    });
                                }, 350);
                            });
                        }

                        if (document.readyState === 'loading') {
                            document.addEventListener('DOMContentLoaded', function () {
                                setTimeout(bootPhotoPagination, 300);
                                setTimeout(bootPhotoPagination, 1000);
                            });
                        } else {
                            setTimeout(bootPhotoPagination, 300);
                            setTimeout(bootPhotoPagination, 1000);
                        }

                        document.addEventListener('pjax:complete', function () {
                            setTimeout(bootPhotoPagination, 300);
                            setTimeout(bootPhotoPagination, 1000);
                        });
                    })();
                </script>
                <!--/* 评论组件 */-->
                <th:block th:replace="~{modules/comment :: comment(group = 'content.halo.run',
                  kind = 'SinglePage',
                  name = 'photos',
                  allowComment = true)}" />
            </div>

        </main>
        <!-- 底部 -->
        <footer th:replace="~{modules/footer :: footer}"></footer>
        <!-- 卡片顶部气泡效果 -->
        <script th:if="${theme.config.other.bubbleEnable}" async data-pjax
                th:src="${assets_link + '/libs/canvas/bubble.js'}"></script>
    </div>

</th:block>

</html>
