<!-- 文章标题背景（独立色）备用覆盖。v5 主要在 post.html 内输出，保证 PJAX 和整页刷新都不闪色。 -->
<th:block th:if="${theme.config.post.postHeroColor.enable}">
  <style type="text/css" th:inline="css">
    #page-header.post-bg{
      --hao-post-hero-light: [(${theme.config.post.postHeroColor.light})];
      --hao-post-hero-dark: [(${theme.config.post.postHeroColor.dark})];
      --hao-post-hero-bg: var(--hao-post-hero-light);
      --heo-main: var(--hao-post-hero-bg) !important;
      --heo-theme: var(--hao-post-hero-bg) !important;
      background-color: var(--hao-post-hero-bg) !important;
    }
    [data-theme="dark"] #page-header.post-bg{
      --hao-post-hero-bg: var(--hao-post-hero-dark);
    }
    #page-header.post-bg::before{
      background-color: var(--hao-post-hero-bg) !important;
    }
    #page-header.post-bg .coverdiv:after{
      box-shadow: 110px -130px 300px 60px var(--hao-post-hero-bg) inset;
    }
  </style>
</th:block>
