<!-- 侧边栏 -->
<div class="aside-content" id="aside-content" th:fragment="aside(widgets)"
     th:if="${theme.config.sidebar.location != 'hide-aside' && not #lists.isEmpty(widgets)}">

    <!-- v8：文章页右侧栏固定工具
         文章页目录已经移动到左侧，所以右侧栏只渲染其它小工具；
         “最新文章”和“标签&归档&统计”单独合并进一个 sticky_layout，滚动时整体跟随固定，避免两个卡片分别 sticky 造成距离不一致。 -->
    <th:block th:if="${htmlType == 'post'}">
        <!-- 先渲染普通侧栏工具，跳过左侧目录、最新文章、标签&归档&统计 -->
        <th:block th:each="widget_data : ${widgets}">
            <th:block th:unless="${widget_data.widget=='toc' || widget_data.widget=='recent-posts' || widget_data.widget=='tags-stat'}">
                <th:block th:unless="${widget_data.widget=='custom_html'}">
                    <th:block th:replace="~{'modules/widgets/aside/'+ ${widget_data.widget}}" />
                </th:block>
                <th:block th:if="${widget_data.widget=='custom_html'}">
                    <th:block th:replace="~{modules/widgets/aside/custom_html :: custom_html(${widget_data})}" />
                </th:block>
            </th:block>
        </th:block>

        <!-- 最新文章 + 标签&归档&统计：文章页右侧固定组合 -->
        <div class="sticky_layout post-sidebar-sticky-tools"
             th:if="${#strings.contains(widgets, 'recent-posts') || #strings.contains(widgets, 'tags-stat')}">
            <th:block th:each="widget_data : ${widgets}">
                <th:block th:if="${widget_data.widget=='recent-posts' || widget_data.widget=='tags-stat'}">
                    <th:block th:replace="~{'modules/widgets/aside/'+ ${widget_data.widget}}" />
                </th:block>
            </th:block>
        </div>
    </th:block>

    <!-- 非文章页保持原有侧栏逻辑 -->
    <th:block th:unless="${htmlType == 'post'}">
        <!-- 侧栏部件，不包含 toc 则直接遍历 -->
        <th:block th:if="${not #strings.contains(widgets, 'toc')}">
            <th:block th:each="widget_data,iterStat : ${widgets}">
                <th:block th:unless="${widget_data.widget=='custom_html'}">
                    <th:block th:if="not ${iterStat.last}">
                        <th:block th:replace="~{'modules/widgets/aside/'+ ${widget_data.widget}}" />
                    </th:block>
                    <th:block th:if="${iterStat.last}">
                        <div class="sticky_layout">
                            <th:block th:replace="~{'modules/widgets/aside/'+ ${widget_data.widget}}" />
                        </div>
                    </th:block>
                </th:block>
                <th:block th:if="${widget_data.widget=='custom_html'}">
                    <th:block th:if="not ${iterStat.last}">
                        <th:block th:replace="~{modules/widgets/aside/custom_html :: custom_html(${widget_data})}" />
                    </th:block>
                    <th:block th:if="${iterStat.last}">
                        <div class="sticky_layout">
                            <th:block th:replace="~{modules/widgets/aside/custom_html :: custom_html(${widget_data})}" />
                        </div>
                    </th:block>
                </th:block>

            </th:block>
        </th:block>

        <!-- 侧栏部件，toc 之后的组件需要被 sticky_layout 包裹 -->
        <th:block th:if="${#strings.contains(widgets, 'toc')}">
            <th:block th:each="widget_data,iterStat : ${widgets}">
                <th:block th:if="${widget_data.widget=='toc'}">
                    <div class="sticky_layout">
                </th:block>
                <th:block th:unless="${widget_data.widget=='custom_html'}">
                    <th:block th:replace="~{'modules/widgets/aside/'+ ${widget_data.widget}}" />
                </th:block>
                <th:block th:if="${widget_data.widget=='custom_html'}">
                    <th:block th:replace="~{modules/widgets/aside/custom_html :: custom_html(${widget_data})}" />
                </th:block>
                <th:block th:if="${iterStat.count==widgets.size()}">
                    </div>
                </th:block>
            </th:block>

        </th:block>
    </th:block>

</div>
