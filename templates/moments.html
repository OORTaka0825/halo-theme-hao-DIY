<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layouts/layout :: layout(content = ~{::content}, htmlType = 'moments',title = ${title + ' | ' + site.title}, head = ~{::head}, _title = ${title})}">
<th:block th:fragment="head">
    <th:block th:replace="~{modules/common/open-graph :: open-graph(_title = ${_title},
                _permalink = '/moments',
                _cover = ${theme.config.other.opengraph.image},
                _excerpt = ${site.seo.description},
                _type = 'website')}"></th:block>
</th:block>
<th:block th:fragment="content">

    <div class="page" id="body-wrap">

        <!-- 头部导航栏 -->
        <header class="not-top-img" id="page-header">
            <nav th:replace="~{modules/nav :: nav(title = ${_title})}"></nav>
        </header>
        <main class="layout hide-aside" id="content-inner">
            <div id="page">
                <div th:replace="~{macro/author-content :: author-content-video(
        background = ${theme.config.moment.backgroundImg},
        video = ${ !#strings.isEmpty(theme.config.moment.backgroundVideo) ? theme.config.moment.backgroundVideo : '' },
        smallTitle = ${theme.config.moment.smallTitle},
        bigTitle = ${theme.config.moment.bigTitle},
        detail = ${theme.config.moment.detail},
        buttonUrl = ${theme.config.moment.buttonUrl},
        buttonTitle = ${theme.config.moment.buttonTitle}
)}"></div>
            <div id="moments-page-area">
                <div id="bber">
                    <section class="timeline page-1">
                        <ul class="list" id="waterfall">
                            <li class="item" th:each="moment : ${moments.items}"
                                th:with="content=${moment.spec.content}">
                                <div class="bber-content">
                                    <div class="datacont" th:if="${not #strings.isEmpty(content.html)}"
                                         th:utext="${content.html}">
                                    </div>
                                    <th:block th:if="${not #lists.isEmpty(content.medium)}">
                                        <div class="bber-container-img"
                                             th:if="${#strings.contains(content.medium,'PHOTO')}">
                                            <img th:each="momentItem : ${content.medium}"
                                                 th:if="${momentItem.type.name == 'PHOTO'}"
                                                 th:src="${isLazyload ? loadingImg : momentItem.url}"
                                                 th:data-lazy-src="${ isLazyload ? momentItem.url : ''}" title="瞬间配图">
                                            <div class="bber-content-noimg"></div>
                                            <div class="bber-content-noimg"></div>
                                            <div class="bber-content-noimg"></div>
                                        </div>
                                        <div th:each="momentItem : ${content.medium}" class="bber-music"
                                             th:if="${momentItem.type.name == 'VIDEO'}">
                                            <video th:src="${momentItem.url}"></video>
                                        </div>
                                    </th:block>
                                </div>

                                <hr>
                                <div class="bber-bottom">
                                    <div class="bber-info">
                                        <div class="bber-info-time"><i class="haofont hao-icon-clock"></i>
                                            <time class="datatime"
                                                  th:text="${#dates.format(moment.spec.releaseTime,'yyyy-MM-dd')}"></time>
                                        </div>
                                    </div>
                                    <a class="bber-reply" th:onclick="rightMenuCommentText([[${content.html}]]);"
                                       data-pjax-state=""> <i class="haofont hao-icon-chat--fill"
                                                              style="font-size: 20px;"></i>
                                    </a>
                                </div>
                            </li>
                        </ul>
                    </section>
                                        <!-- 瞬间分页 -->
                    <nav id="moment-pagination" class="moment-pagination"
             th:if="${moments.totalPages > 1}">
            <a class="moment-page-btn"
               th:classappend="${!moments.hasPrevious} ? ' disabled' : ''"
               th:href="${moments.hasPrevious ? moments.prevUrl : 'javascript:void(0)'}">
                上一页
            </a>

            <span class="moment-page-num">
                <span th:text="${moments.page}">1</span>
                <span>/</span>
                <span th:text="${moments.totalPages}">1</span>
            </span>

            <a class="moment-page-btn"
               th:classappend="${!moments.hasNext} ? ' disabled' : ''"
               th:href="${moments.hasNext ? moments.nextUrl : 'javascript:void(0)'}">
                下一页
            </a>
        </nav>
    </div>

    <div id="bber-tips" style="color: var(--heo-secondtext);"
         th:if="${moments.totalPages <= 1}">
        - 已展示全部短文 -
    </div>
</div>

                <script>heo.reflashEssayWaterFall();</script>
                <script data-pjax>
    (function () {
        function refreshMomentLayout() {
            if (window.heo && typeof heo.reflashEssayWaterFall === 'function') {
                heo.reflashEssayWaterFall();
                setTimeout(() => heo.reflashEssayWaterFall(), 300);
            }

            if (window.lazyLoadInstance && typeof window.lazyLoadInstance.update === 'function') {
                window.lazyLoadInstance.update();
            }
        }

        async function loadMomentPage(url, pushState = true) {
            const area = document.querySelector('#moments-page-area');
            if (!area || area.dataset.loading === 'true') return;

            area.dataset.loading = 'true';
            area.classList.add('is-loading');

            try {
                const res = await fetch(url, {
                    credentials: 'same-origin',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                if (!res.ok) {
                    window.location.href = url;
                    return;
                }

                const html = await res.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const newArea = doc.querySelector('#moments-page-area');

                if (!newArea) {
                    window.location.href = url;
                    return;
                }

                area.innerHTML = newArea.innerHTML;

                if (pushState) {
                    window.history.pushState({ momentAjax: true }, '', url);
                }

                refreshMomentLayout();

                const target = document.querySelector('#moments-page-area');
                if (target) {
                    const top = target.getBoundingClientRect().top + window.scrollY - 90;
                    window.scrollTo({
                        top: top,
                        behavior: 'smooth'
                    });
                }
            } catch (e) {
                console.error('瞬间分页加载失败：', e);
                window.location.href = url;
            } finally {
                area.dataset.loading = 'false';
                area.classList.remove('is-loading');
            }
        }

        function bindMomentAjaxPagination() {
            if (window.__haoMomentAjaxPaginationBinded) return;
            window.__haoMomentAjaxPaginationBinded = true;

            document.addEventListener('click', function (e) {
                const link = e.target.closest('#moment-pagination a.moment-page-btn');
                if (!link) return;

                if (link.classList.contains('disabled')) {
                    e.preventDefault();
                    return;
                }

                const href = link.getAttribute('href');
                if (!href || href === 'javascript:void(0)') {
                    e.preventDefault();
                    return;
                }

                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();

                loadMomentPage(link.href, true);
            }, true);

            window.addEventListener('popstate', function () {
                if (location.pathname.includes('/moments')) {
                    loadMomentPage(location.href, false);
                }
            });
        }

        bindMomentAjaxPagination();
        refreshMomentLayout();

        document.addEventListener('pjax:complete', function () {
            bindMomentAjaxPagination();
            refreshMomentLayout();
        });
    })();
</script>
                <hr />
                <!--/* 评论组件 */-->
                <th:block th:replace="~{modules/comment :: comment(group = 'content.halo.run',
                  kind = 'SinglePage',
                  name = 'moments',
                  allowComment = true)}" />

            </div>


        </main>
        <!-- 底部 -->
        <footer th:replace="~{modules/footer :: footer}"></footer>
        <!-- 卡片顶部气泡效果 -->
        <script th:if="${theme.config.other.bubbleEnable}" async data-pjax
                th:src="${assets_link + '/libs/canvas/bubble.js'}"></script>
    </div>

</th:block>

</html>
