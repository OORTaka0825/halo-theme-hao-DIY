apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-hao-setting
spec:
  forms:
  - group: basics
    label: 基础
    formSchema:
    - $formkit: code
      name: siteTitle
      label: 站点名称
      placeholder: 请输入站点名称
      height: 80px
      language: html
      help: 支持 HTML 语法
    - $formkit: date
      name: siteStartTime
      label: 建站时间
      validation: required
      value: '2023-08-05'
      help: 注意，此项为必填项
    - $formkit: text
      name: icp
      label: ICP 备案
      placeholder: 请输入 ICP 备案号
      help: 格式：皖ICP备 xxxxxxxx 号
    - $formkit: text
      name: gongan
      label: 公安备案
      placeholder: 请输入公安备案号
      help: 格式：皖公网安备 xxxxxxxx 号
    - $formkit: url
      name: copyrightAgreement
      label: 版权协议
      placeholder: 请输入版权协议地址
      help: 文章模块声明版权，也会使用此协议
  - group: nav
    label: 导航
    formSchema:
    - $formkit: group
      name: menus
      label: 菜单控制
      value:
        pc_leftMenu: true
        phone_leftMenu: true
        phone_menu: true
        enable_ali_iconfont_symbol_header: false
      children:
      - $formkit: switch
        name: pc_leftMenu
        id: pc_leftMenu
        label: pc端左侧菜单
      - $formkit: switch
        name: phone_leftMenu
        label: 移动左侧菜单
      - $formkit: switch
        name: phone_menu
        label: 移动主菜单
      - $formkit: switch
        name: enable_ali_iconfont_symbol_header
        label: 阿里巴巴IconFont Symbol
        help: '开启后，可以使用阿里IconFont的Symbol彩色图标。语法为 #icon-xxx，例如 #icon-shouye'
      - $formkit: text
        name: iconfont_js
        label: 阿里巴巴 IconFont Symbol 链接
        help: 填写 IconFont 的Symbol js 链接，例如 //at.alicdn.com/t/c/font_xxxxx.js
        value: ''
    - $formkit: menuRadio
      name: leftMenu
      if: $get(pc_leftMenu).value
      label: 站点名左侧菜单
      help: 默认只有主菜单，可前往【外观】—>【菜单】新建菜单组
      value: ''
    - $formkit: group
      name: right
      label: 导航栏右侧
      value:
        travelling: true
        article: true
        darkMode: true
        navLogin: false
        console:
          consoleEnable: true
      children:
      - $formkit: switch
        name: travelling
        id: travelling
        key: travelling
        label: 开往按钮
      - $formkit: switch
        name: article
        label: 随机文章
        help: 右上角随机文章按钮
      - $formkit: switch
        name: darkMode
        label: 切换模式
        help: 右上角切换主题模式按钮
      - $formkit: switch
        name: navLogin
        label: 登入按钮
        help: 右上角登入按钮
      - $formkit: group
        name: console
        label: 中控台
        children:
        - $formkit: switch
          name: consoleEnable
  - group: top
    label: 顶部
    formSchema:
    - $formkit: group
      name: above
      label: 首页第一屏
      help: 开启后会在页面的最上方新增一个第一屏
      value:
        enable_above: false
        typed: null
        enable_typed_random: null
        enable_above_video: null
        index_img: null
        phone_index_img: null
        index_video: null
      children:
      - $formkit: switch
        name: enable_above
        key: enable_above
        id: enable_above
      - $formkit: repeater
        name: typed
        if: $get(enable_above).value
        label: 打字机显示的文字
        value: []
        children:
        - $formkit: text
          name: text
          label: 自定义文字
          placeholder: 请输入自定义文字
      - $formkit: switch
        label: 随机文字
        if: $get(enable_above).value
        name: enable_typed_random
        key: enable_typed_random
        id: enable_typed_random
        value: false
        help: 如果配置了自定义文字，优先展示自定义文字
      - $formkit: switch
        if: $get(enable_above).value
        label: 背景模式
        name: enable_above_video
        key: enable_above_video
        id: enable_above_video
        value: false
      - $formkit: select
        if: $get(enable_above).value
        name: full_page_height
        key: full_page_height
        id: full_page_height
        label: 铺满屏幕
        value: 100vh
        options:
        - label: 100%
          value: 100vh
        - label: 75%
          value: 75vh
        - label: 50%
          value: 50vh
        - label: 25%
          value: 25vh
      - $formkit: attachment
        name: index_video
        key: index_video
        id: index_video
        if: $get(enable_above).value  &&  $get(enable_above_video).value
        label: 动态壁纸
        placeholder: 请填写动态壁纸地址
        value: ''
        help: http(s)://xxx.mp4
      - $formkit: attachment
        name: index_img
        if: $get(enable_above).value  &&  $get(enable_above_video).value == false
        label: PC背景图
        placeholder: 请填写背景图地址
        value: https://www.dmoe.cc/random.php
      - $formkit: attachment
        name: phone_index_img
        if: $get(enable_above).value  &&  $get(enable_above_video).value == false
        label: 移动端背景图
        placeholder: 请填写移动端背景图地址
        value: https://imgapi.kouseki.cn/random?sort=mp
    - $formkit: group
      name: global_background
      label: 全局背景设置
      help: 开启后设置全局背景图片/视频
      value:
        enable_global_background_img: false
        index_background_img: null
      children:
      - $formkit: switch
        label: 全局透明背景图
        name: enable_global_background_img
        key: enable_global_background_img
        id: enable_global_background_img
        value: false
        help: 首页透明背景图
      - $formkit: switch
        if: $get(enable_global_background_img).value
        label: 全局背景模式
        name: enable_global_background_above_video
        key: enable_global_background_above_video
        id: enable_global_background_above_video
        value: false
      - $formkit: attachment
        name: global_background_img_light
        key: global_background_img_light
        id: global_background_img_light
        if: $get(enable_global_background_img).value  &&  $get(enable_global_background_above_video).value == false
        label: 全局背景图片（亮主题）
        placeholder: 请填写亮主题全局背景图片地址
      - $formkit: attachment
        name: global_background_img_dark
        key: global_background_img_dark
        id: global_background_img_dark
        if: $get(enable_global_background_img).value  &&  $get(enable_global_background_above_video).value == false
        label: 全局背景图片（暗主题）
        placeholder: 请填写暗主题全局背景图片地址
      - $formkit: attachment
        name: global_background_video
        id: global_background_video
        key: global_background_video
        if: $get(enable_global_background_img).value  &&  $get(enable_global_background_above_video).value
        label: 全局背景视频
        placeholder: 请填写全局背景视频地址
    - $formkit: switch
      name: moment
      label: 瞬间说说
      value: true
      help: 需要安装瞬间插件
    - $formkit: group
      name: climb
      label: 宠物挂件
      help: 需要瞬间丶顶部 Banner显示
      value:
        climbEnable: false
        climbImg: https://imgapi.yyds.pink/random?sort=animals
      children:
      - $formkit: switch
        name: climbEnable
        key: climbEnable
        id: climbEnable
      - $formkit: url
        name: climbImg
        if: $get(climbEnable).value
        label: 图片
        help: 随机图地址：https://imgapi.yyds.pink/random?sort=animals
    - $formkit: switch
      name: recentTop
      id: recentTop
      key: recentTop
      label: 顶部 Banner
      value: true
    - $formkit: group
      name: BannerLeft
      label: Banner 左侧
      if: $get(recentTop).value
      value:
        bannersBackground: 默认
        bannersTitleBig: Halo Theme Hao
        bannersTitleSmall: 更多信息请关注 GitHub
        categoryGroup:
        - title: 必看精选
          icon: haofont hao-icon-book
          url: /
          colorOneLight: '#358bff'
          colorTwoLight: '#15c6ff'
          colorOneDark: '#0653b8'
          colorTwoDark: '#2fcbff'
        - title: 热门文章
          icon: haofont hao-icon-fire
          url: /
          colorOneLight: '#ff6655'
          colorTwoLight: '#ffbf37'
          colorOneDark: '#e22a16'
          colorTwoDark: '#da980c'
        - title: 实用教程
          icon: haofont hao-icon-book
          url: /
          colorOneLight: '#18e7ae'
          colorTwoLight: '#1eebeb'
          colorOneDark: '#099e74'
          colorTwoDark: '#0ea4a4'
        techStack: null
      children:
      - $formkit: select
        name: bannersBackground
        label: 背景图
        options:
        - label: 默认技术栈
          value: default
        - label: 个人技术栈
          value: techStack
      - $formkit: repeater
        name: techStack
        label: 个人技术栈
        help: 需要选择上方“个人技术栈”
        value: []
        children:
        - $formkit: text
          name: name
          label: 名称
          placeholder: 请输入名称
        - $formkit: attachment
          name: url
          label: 路径
          placeholder: 请输入图标路径
        - $formkit: color
          name: background
          label: 背景色
      - $formkit: textarea
        name: bannersTitleBig
        label: 大标题
        placeholder: 请输入大标题
        help: 支持 HTML 语法
      - $formkit: textarea
        name: bannersTitleSmall
        label: 小标题
        placeholder: 请输入小标题
        help: 支持 HTML 语法
      - $formkit: repeater
        name: categoryGroup
        min: 3
        max: 3
        children:
        - $formkit: text
          name: title
          label: 标题
          placeholder: 请输入内容
          validation: required
          value: 必看精选
        - $formkit: text
          name: icon
          label: 图标
          placeholder: 请输入内容
          validation: required
          value: haofont hao-icon-book
        - $formkit: url
          name: url
          label: 跳转地址
          placeholder: 请输入内容
          validation: required
          value: /
        - $formkit: color
          name: colorOneLight
          label: 颜色1 (浅色)
          validation: required
          value: '#358bff'
        - $formkit: color
          name: colorTwoLight
          label: 颜色2 (浅色)
          validation: required
          value: '#15c6ff'
        - $formkit: color
          name: colorOneDark
          label: 颜色1 (深色)
          validation: required
          value: '#0653b8'
        - $formkit: color
          name: colorTwoDark
          label: 颜色2 (深色)
          validation: required
          value: '#2fcbff'
    - $formkit: group
      name: BannerRight
      label: Banner 右侧
      if: $get(recentTop).value
      value:
        todayRecommend: true
        todayRecommendContent:
          todayRecommendUrl: /
          todayRecommendTitle: Halo-Theme-Hao
          todayRecommendCover: https://liuzhihang.com/upload/hao_dark.jpg
          todayRecommendxTitle: 今日推荐
        recommendPost: latest
      children:
      - $formkit: switch
        name: todayRecommend
        id: todayRecommend
        key: todayRecommend
        label: 今日推荐
        help: 开启后会在推荐文章前显示“今日推荐”模块
      - $formkit: group
        name: todayRecommendContent
        if: $get(todayRecommend).value
        label: 今日推荐
        value:
          todayRecommendUrl: null
          todayRecommendTitle: null
          todayRecommendCover: null
          todayRecommendxTitle: null
        children:
        - $formkit: url
          name: todayRecommendUrl
          label: 跳转地址
          placeholder: 请输入地址
          value: /
        - $formkit: text
          name: todayRecommendxTitle
          label: 小标题
          placeholder: 请输入小标题
          value: 今日推荐
        - $formkit: text
          name: todayRecommendTitle
          label: 大标题
          placeholder: 请输入标题
          value: Halo-Theme-Hao
        - $formkit: attachment
          name: todayRecommendCover
          label: 背景图
          placeholder: 请输入地址
          value: https://liuzhihang.com/upload/hao_dark.jpg
        - $formkit: attachment
          name: todayRecommendVideo
          label: 背景视频
          placeholder: 请输入 MP4 视频地址
          value: ''
          help: 可上传/选择/输入 .mp4 视频链接；为空时使用上方背景图兜底
      - $formkit: select
        name: recommendPost
        id: recommendPost
        key: recommendPost
        label: 推荐文章
        value: latest
        options:
        - label: 最新文章
          value: latest
        - label: 自定义
          value: custom
      - $formkit: repeater
        if: $get(recommendPost).value === 'custom'
        name: recommendPostCustom
        label: 自定义文章
        help: 建议设置六篇文章
        max: 6
        children:
        - $formkit: postSelect
          name: post
          label: 文章
          value: ''
          validation: required
  - group: layout
    label: 布局
    formSchema:
    - $formkit: group
      name: navs
      value:
        nav: category
        navCustomCategory: null
        navCustomTag: null
        navCustomUrl: null
        navMore: null
        navMoreCustomUrl: null
      children:
      - $formkit: select
        name: nav
        id: nav
        key: nav
        label: 导航条显示内容
        options:
        - label: 分类
          value: category
        - label: 标签
          value: tag
        - label: 自定义分类
          value: custom-category
        - label: 自定义标签
          value: custom-tag
        - label: 自定义路径
          value: custom-url
      - $formkit: repeater
        if: $get(nav).value === 'custom-category'
        name: navCustomCategory
        label: 自定义分类
        value: []
        children:
        - $formkit: categorySelect
          name: category
          label: 分类
      - $formkit: repeater
        if: $get(nav).value === 'custom-tag'
        name: navCustomTag
        label: 自定义标签
        value: []
        children:
        - $formkit: tagSelect
          name: tag
          label: 标签
      - $formkit: repeater
        if: $get(nav).value === 'custom-url'
        name: navCustomUrl
        label: 自定义路径
        value: []
        children:
        - $formkit: text
          name: title
          label: 标题
        - $formkit: url
          name: url
          label: 链接
      - $formkit: select
        name: navMore
        id: navMore
        key: navMore
        label: 更多按钮跳转地址
        value: categories
        options:
        - label: 隐藏
          value: hide
        - label: 分类
          value: categories
        - label: 标签
          value: tags
        - label: 自定义地址
          value: customUrl
      - $formkit: url
        if: $get(navMore).value === 'customUrl'
        name: navMoreCustomUrl
        label: 文章导航更多跳转路径
        value: null
    - $formkit: group
      name: post
      value:
        cols: col2
        postLocation: top
      children:
      - $formkit: select
        name: cols
        label: 文章布局
        options:
        - label: 单列
          value: col1
        - label: 两列
          value: col2
        - label: 三列
          value: col3
        - label: 四列
          value: col4
      - $formkit: select
        name: postLocation
        label: 封面位置
        options:
        - label: 上方
          value: top
        - label: 左侧
          value: left
        - label: 右侧
          value: right
        - label: 交替
          value: alternate
        help: 建议单列时，将图片放在左右
    - $formkit: url
      name: postRandomImg
      label: 随机封面
      value: https://source.unsplash.com/random/600x400/?blog,scenery,night,desert,sea
      help: 未设置文章封面时，将使用随机封面 (二次元随机图地址：https://www.dmoe.cc/random.php)
    - $formkit: switch
      name: articleCardPolish
      label: 首页文章卡片(擦亮效果)
      value: false
  - group: sidebar
    label: 侧栏
    formSchema:
    - $formkit: select
      name: location
      label: 侧边栏位置
      value: right-aside
      options:
      - value: hide-aside
        label: 隐藏
      - value: right-aside
        label: 右侧
      - value: left-aside
        label: 左侧
    - $formkit: group
      name: widgetss
      label: 侧边栏内容
      value:
        indexWidget:
        - widget: profile
        - widget: wechat
        - widget: comments
        - widget: recent-posts
        - widget: categories
        postWidget:
        - widget: profile
        - widget: wechat
        - widget: toc
        - widget: comments
        - widget: recent-posts
        - widget: categories
        tagWidget:
        - widget: profile
        - widget: wechat
        - widget: comments
        - widget: recent-posts
        - widget: categories
        categoryWidget:
        - widget: profile
        - widget: wechat
        - widget: comments
        - widget: recent-posts
        - widget: categories
        pageWidget: null
      children:
      - $formkit: repeater
        name: indexWidget
        id: indexWidget
        label: 首页
        children:
        - $formkit: select
          name: widget
          id: widget
          key: widget
          label: 小工具
          options:
          - value: profile
            label: 个人卡片
          - value: wechat
            label: 公众号
          - value: power
            label: 爱发电赞助
          - value: steam
            label: Steam卡片
          - value: music
            label: 音乐卡片
          - value: welcome
            label: 小板报
          - value: friend-link
            label: 通讯录
          - value: recent-posts
            label: 最新文章
          - value: visit-posts
            label: 热门文章
          - value: comments
            label: 最新评论
          - value: categories
            label: 文章分类
          - value: tags
            label: 文章标签
          - value: stat
            label: 统计
          - value: tags-stat
            label: 标签&归档&统计
          - value: adbox
            label: 广告区域
          - value: custom_html
            label: 自定义
        - $formkit: group
          name: custom_html
          if: $value.widget == 'custom_html'
          key: custom_html
          label: 自定义内容
          children:
          - $formkit: code
            name: title
            label: 标题
            help: 支持html语法
            height: 50px
            value: <i class="haofont hao-icon-folder-open"></i><span>分类</span>
            language: html
          - $formkit: code
            name: html
            label: 内容
            height: 200px
            help: 支持html语法
            language: html
      - $formkit: repeater
        name: postWidget
        id: postWidget
        label: 文章页
        help: post 可以支持设置 toc
        children:
        - $formkit: select
          name: widget
          id: widget
          key: widget
          label: 小工具
          options:
          - value: profile
            label: 个人卡片
          - value: toc
            label: 目录
          - value: wechat
            label: 公众号
          - value: power
            label: 爱发电赞助
          - value: steam
            label: Steam卡片
          - value: music
            label: 音乐卡片
          - value: welcome
            label: 小板报
          - value: friend-link
            label: 通讯录
          - value: recent-posts
            label: 最新文章
          - value: visit-posts
            label: 热门文章
          - value: comments
            label: 最新评论
          - value: categories
            label: 文章分类
          - value: tags
            label: 文章标签
          - value: stat
            label: 统计
          - value: tags-stat
            label: 标签&归档&统计
          - value: adbox
            label: 广告区域
          - value: custom_html
            label: 自定义
        - $formkit: group
          name: custom_html
          if: $value.widget == 'custom_html'
          key: custom_html
          label: 自定义内容
          children:
          - $formkit: code
            name: title
            label: 标题
            help: 支持html语法
            height: 100px
            value: <i class="haofont hao-icon-folder-open"></i><span>分类</span>
            language: html
          - $formkit: code
            name: html
            label: 内容
            height: 200px
            help: 支持html语法
            language: html
      - $formkit: repeater
        name: tagWidget
        id: tagWidget
        label: 标签页
        children:
        - $formkit: select
          name: widget
          id: widget
          key: widget
          label: 小工具
          options:
          - value: profile
            label: 个人卡片
          - value: wechat
            label: 公众号
          - value: power
            label: 爱发电赞助
          - value: steam
            label: Steam卡片
          - value: music
            label: 音乐卡片
          - value: welcome
            label: 小板报
          - value: friend-link
            label: 通讯录
          - value: recent-posts
            label: 最新文章
          - value: visit-posts
            label: 热门文章
          - value: comments
            label: 最新评论
          - value: categories
            label: 文章分类
          - value: tags
            label: 文章标签
          - value: stat
            label: 统计
          - value: tags-stat
            label: 标签&归档&统计
          - value: adbox
            label: 广告区域
          - value: custom_html
            label: 自定义
        - $formkit: group
          name: custom_html
          if: $value.widget == 'custom_html'
          key: custom_html
          label: 自定义内容
          children:
          - $formkit: code
            name: title
            label: 标题
            help: 支持html语法
